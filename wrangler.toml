name = "piso-ai-validator"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# --- 100% FREE TIER CLOUDFLARE WORKERS AI ---
# Provides 10,000 free inference requests per day for deliverable parsing
[ai]
binding = "AI"

# --- 100% FREE TIER KV STORAGE ---
# State caching for micro-clearing and validator execution logs
[[kv_namespaces]]
binding = "piso-ai-validator-PISO_KV"
id = "2472efff5d67497d8009ba15f82515e8"

# --- 24/7 FREE CRON TRIGGER (NO LOCAL PC REQUIRED) ---
# Wakes up every 5 minutes to inspect escrow deliverables and submit AI attestations
[triggers]
crons = ["*/5 * * * *"]

# --- ENVIRONMENT VARIABLES ---
[vars]
RPC_URL = "https://rpc.pisochain.com"
CHAIN_ID = "2026001"
EXPLORER_URL = "https://pisochain.com/explorer"
REGISTRY_CONTRACT_ADDRESS = "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
PAYMASTER_CONTRACT_ADDRESS = "0x53d284357ec70cE289D6D64134DfAc8E511c8a3D"

# SECRETS TO CONFIGURE VIA:
# npx wrangler secret put VALIDATOR_SESSION_PRIVATE_KEY
# npx wrangler secret put PAYMASTER_PRIVATE_KEY
# npx wrangler secret put GEMINI_API_KEY (optional fallback)

